<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCourt</title>
<meta name="robots" content="noindex">
<style>
  :root { --green:#217d66; --deep:#0f4a3a; --amber:#f59e0a; --ink:#1c2b27; --muted:#5d6f6a; --bg:#eef3f1; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--ink); padding:24px 16px; }
  .card { width:100%; max-width:440px; background:#fff; border-radius:20px; overflow:hidden;
          box-shadow:0 12px 40px rgba(15,74,58,.12); }
  header { background:linear-gradient(135deg,#1e8a6e,var(--deep)); color:#fff; padding:26px 28px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; }
  .dot { width:14px; height:14px; border-radius:50%; background:var(--amber); box-shadow:0 0 14px var(--amber); }
  h1 { margin:18px 0 0; font-size:26px; line-height:1.2; }
  main { padding:24px 28px 28px; font-size:16px; line-height:1.55; }
  p { margin:0 0 16px; }
  .muted { color:var(--muted); font-size:14px; }
  .button { display:inline-block; background:var(--green); color:#fff; text-decoration:none; font-weight:600;
            padding:13px 24px; border-radius:12px; margin:4px 0 16px; }
  .spinner { width:22px; height:22px; border:3px solid #d6e5e0; border-top-color:var(--green); border-radius:50%;
             animation:spin 0.9s linear infinite; display:inline-block; vertical-align:middle; margin-right:10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <header>
    <div class="brand"><span class="dot"></span>OpenCourt</div>
    <h1 id="title">Opening OpenCourt…</h1>
  </header>
  <main>
    <p id="opening"><span class="spinner"></span>Handing you over to the app.</p>
    <div id="done" hidden>
      <p id="message"></p>
      <a id="open" class="button" href="#">Open OpenCourt</a>
      <p class="muted" id="hint"></p>
    </div>
  </main>
</div>
<script>
  // Supabase sends people here after they tap the link in a confirmation or password-reset
  // email. On the phone where they signed up, the app finishes signing them in; anywhere
  // else, the email is already confirmed and we say so. No data is collected on this page.
  (function () {
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    var flow = q.get("flow") === "reset" ? "reset" : "confirm";
    var code = q.get("code");
    var error = q.get("error_description") || h.get("error_description") || q.get("error") || h.get("error");
    var $ = function (id) { return document.getElementById(id); };

    function show(title, message, hint, link) {
      $("title").textContent = title;
      $("message").textContent = message;
      $("hint").textContent = hint || "";
      $("opening").hidden = true;
      $("done").hidden = false;
      if (link) { $("open").href = link; } else { $("open").hidden = true; }
    }

    if (error) {
      var expired = /expired|invalid|used/i.test(error);
      show(expired ? "This link has expired" : "Something went wrong",
           expired ? "Links in OpenCourt emails work once and expire after an hour."
                   : error.replace(/\+/g, " "),
           flow === "reset" ? "Ask for a new reset email from the app: Sign in, then “Forgot password?”."
                            : "Try signing in to the app; if your email isn't confirmed yet, create your account again to get a fresh link.");
      return;
    }
    if (!code) {
      show("OpenCourt", "See which pickleball courts are open and how long the wait is, before you go.",
           "Get the app on your iPhone to use it.");
      return;
    }

    var appLink = "opencourt://auth/" + flow + "?code=" + encodeURIComponent(code);
    var phone = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (phone) { location.href = appLink; }

    setTimeout(function () {
      if (flow === "reset") {
        show("Choose a new password",
             phone ? "If OpenCourt didn't open, tap below." : "Open this link on your iPhone to choose a new password in the app.",
             phone ? "Didn't work? Ask for a new reset email from the app." : "", phone ? appLink : null);
      } else {
        show("You're confirmed",
             phone ? "Your email is confirmed. If OpenCourt didn't open, tap below to finish signing in."
                   : "Your email is confirmed. Open OpenCourt on your iPhone and sign in.",
             phone ? "Tapping the button on a different phone? Just sign in there instead." : "You can close this tab.",
             phone ? appLink : null);
      }
    }, phone ? 1200 : 0);
  })();
</script>
</body>
</html>
