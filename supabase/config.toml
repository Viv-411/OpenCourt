# Minimal Supabase CLI config (`supabase start` needs Docker; `supabase db push` does not).
project_id = "opencourt"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
enabled = true
