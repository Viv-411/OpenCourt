[project]
name = "opencourt"
version = "0.1.0"
description = "Court occupancy, queue counting, and rotation signals for public pickleball courts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Detection + tracking + video IO (Mac dev and Pi)
vision = [
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "lap>=0.5",
    "ncnn>=1.0.20240410",  # runs the exported model; several times faster than PyTorch on a Pi
]
# Raspberry Pi only
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2; platform_machine == 'aarch64'",
]

[project.scripts]
opencourt = "opencourt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pnnx>=20240410",  # converts YOLO to NCNN (`opencourt export-model`); the Pi only runs the result
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencourt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running simulation tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
